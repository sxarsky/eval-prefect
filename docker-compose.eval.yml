# Lightweight Prefect stack for eval. Uses SQLite — no separate database service.
#
# Starts a Prefect server from the patched source in the cloned repo by:
#   1. Using `prefecthq/prefect:3.6.24-python3.10` as the base image (has all deps installed)
#   2. Mounting the cloned repo at /app
#   3. Reinstalling only the `prefect` package itself from source (`pip install --no-deps -e .`)
#      — so our patched code runs but we keep the base image's compatible dependency tree
#
# Invoked by scripts/testbot/eval-testbot.sh with `--project-directory <cloned-repo>`
# so `.:/app` binds to the patched source tree.
services:
  prefect-server:
    image: prefecthq/prefect:3.6.24-python3.10
    working_dir: /app
    volumes:
      - .:/app
      # Keep the SQLite DB off the Docker-Desktop bind mount — concurrent UI
      # requests cause "sqlite3.OperationalError: disk I/O error" when the DB
      # lives on the host-mounted path. A named volume uses Docker's native
      # filesystem which handles SQLite's locking correctly.
      - prefect-home:/prefect-home
    environment:
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      PREFECT_HOME: /prefect-home
      PREFECT_SERVER_CORS_ALLOWED_ORIGINS: "*"
      # Required by pr-e-admin-key-destructive-ops: validates X-Admin-Key header
      # for DELETE /api/flows/{id} and DELETE /api/deployments/{id}.
      # Other PRs don't enforce this key (no require_admin_key dependency in their code).
      PREFECT_SERVER_ADMIN_API_KEY: "skyramp-test-token"
    command: >
      bash -c "
        pip install --quiet --no-deps -e . &&
        prefect server start --host 0.0.0.0 --no-services
      "
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

  # Vite dev server for the React UI (ui-v2). Needed for frontend/fullstack PRs
  # so the testbot can record Playwright traces at http://localhost:5173.
  # The UI's JavaScript is executed by the browser (not this container), so it
  # uses the host-mapped backend port (4200) via VITE_API_URL.
  #
  # node_modules is mounted as a named volume so `npm ci` is cached across runs
  # (install is ~3–5 min on first run for a clean volume, seconds on reuse).
  prefect-ui:
    image: node:22-slim
    working_dir: /app/ui-v2
    volumes:
      - .:/app
      - prefect-ui-node-modules:/app/ui-v2/node_modules
    environment:
      VITE_API_URL: http://localhost:4200/api
    command: >
      bash -c "
        if [ ! -f node_modules/.package-lock.json ]; then
          echo 'Installing ui-v2 dependencies (first run, may take a few minutes)...' &&
          npm ci --no-audit --no-fund --prefer-offline
        fi &&
        npm run dev -- --host 0.0.0.0 --port 5173
      "
    ports:
      - "5173:5173"
    depends_on:
      prefect-server:
        condition: service_healthy
    healthcheck:
      # bash TCP check — curl is not in node:22-slim
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5173' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30   # up to 5 min total after start_period
      start_period: 300s  # allow first-run npm ci to complete

volumes:
  prefect-ui-node-modules:
  prefect-home:
